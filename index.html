<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Final Version</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // 黒背景を切り抜く専用プログラム (Luma Key Shader)
      AFRAME.registerShader('luma-key', {
        schema: {
          src: {type: 'map'},
          threshold: {type: 'number', default: 0.05} // ここで黒の消え具合を調整
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D src;
          uniform float threshold;
          void main() {
            vec4 color = texture2D(src, vUv);
            // 明るさを計算
            float brightness = dot(color.rgb, vec3(0.299, 0.587, 0.114));
            // 明るさがしきい値より低ければ透明にする
            if (brightness < threshold) {
              discard;
            } else {
              gl_FragColor = vec4(color.rgb, 1.0);
            }
          }
        `
      });
    </script>
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.7); color: white; font-family: sans-serif;
        font-size: 20px; z-index: 9999; text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="overlay">画面をタップして開始</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="ar-video" src="k.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-entity camera>
        <!-- 独自シェーダー luma-key を使用 -->
        <a-entity id="video-screen" 
                  geometry="primitive: plane; width: 2; height: 1.1;" 
                  material="shader: luma-key; src: #ar-video; transparent: true;"
                  position="0 0 -2" 
                  visible="false">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#ar-video');
      const videoScreen = document.querySelector('#video-screen');

      // 比率を自動調整
      function adjustAspectRatio() {
        if (video.videoWidth > 0) {
          const ratio = video.videoHeight / video.videoWidth;
          videoScreen.setAttribute('geometry', {
            primitive: 'plane',
            width: 2,
            height: 2 * ratio
          });
        }
      }

      window.addEventListener('touchstart', function () {
        overlay.style.display = 'none';
        
        // 動画の読み込みを待ってから比率調整
        if (video.readyState >= 1) {
          adjustAspectRatio();
        } else {
          video.addEventListener('loadedmetadata', adjustAspectRatio);
        }

        videoScreen.setAttribute('visible', 'true');
        video.play();
        
        // 10秒後にAmazonへ
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/";
        }, 10000);
      }, {once: true});
    </script>
  </body>
</html>
