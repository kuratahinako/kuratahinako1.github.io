<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Video Effect</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <!-- 表示したい動画ファイルを指定 (mp4推奨) -->
        <video id="ar-video" src="k.webm" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- 
        'hiro' マーカーを使用（AR.js標準のマーカー）
        カメラがこのマーカーを捉えると動画が表示される
      -->
      <a-marker preset="hiro">
        <a-video src="#ar-video" width="1.6" height="0.9" rotation="-90 0 0"></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 1. 画面をタップしたら動画を再生する（ブラウザの制限対策）
      window.addEventListener('click', function () {
        const video = document.querySelector('#ar-video');
        video.play();
        
        // 2. 10秒後に別サイトへ遷移
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/s?k=%E9%98%B2%E7%81%BD+%E5%AE%B6%E5%85%B7+%E5%9B%BA%E5%AE%9A&language=ja_JP&adgrpid=1323814616398442&hvadid=82738655227204&hvbmt=bp&hvdev=c&hvlocphy=140224&hvnetw=o&hvqmt=p&hvtargid=kwd-82739786844809%3Aloc-96&hydadcr=27299_14815141&jp-ad-ap=0&mcid=15253043ae783f8b8796fcfadbb8b3f3&msclkid=866ee2dd5b31118d2efc88fd8835a9bd&tag=jpdeskstandse-22&ref=pd_sl_5wpcegjk4g_p"; // 移行先のURL
        }, 10000); // 10000ミリ秒 = 10秒
      });
    </script>
  </body>
</html>
