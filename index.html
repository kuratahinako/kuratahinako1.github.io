<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Transparent Video</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* カメラ映像の上に重なる動画のスタイル */
      #ar-video {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;      /* 横幅いっぱいに表示 */
        max-height: 100%; /* 縦がはみ出さないように */
        z-index: 10;      /* カメラより上に配置 */
        display: none;    /* 最初は隠しておく */
        /* 【重要】黒い背景を透過させる魔法の1行 */
        mix-blend-mode: screen; 
      }

      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.6); color: white; font-family: sans-serif;
        font-size: 20px; z-index: 9999; text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="overlay">画面をタップして開始</div>

    <!-- 動画タグをA-Frameの外側に配置（CSSで制御するため） -->
    <video id="ar-video" src="k.mp4" playsinline webkit-playsinline></video>

    <!-- カメラを起動するためだけのA-Frameシーン -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#ar-video');

      window.addEventListener('touchstart', function () {
        overlay.style.display = 'none'; // 案内を消す
        video.style.display = 'block'; // 動画を表示
        video.play();                  // 動画再生
        
        // 10秒後にAmazonへ遷移
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/";
        }, 10000);
      }, {once: true});
    </script>
  </body>
</html>
