<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR ChromaKey</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // グリーンバックを消去する専用プログラム
      AFRAME.registerShader('chromakey', {
        schema: {
          src: {type: 'map'},
          color: {type: 'color', default: '#00FF00'}
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D src;
          uniform vec3 color;
          void main() {
            vec4 texColor = texture2D(src, vUv);
            // 緑色との差を計算
            float diff = distance(texColor.rgb, color);
            if (diff < 0.4) {
              discard; // 緑に近い色は描画しない
            } else {
              gl_FragColor = texColor;
            }
          }
        `
      });
    </script>
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.7); color: white; font-family: sans-serif;
        font-size: 20px; z-index: 9999; text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="overlay">画面をタップして開始</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="ar-video" src="k.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-entity camera>
        <!-- 
          width: 2; height: 1.1; は目安です。
          JavaScriptが動画読み込み後に正しい比率に直します。
        -->
        <a-entity id="video-screen" 
                  geometry="primitive: plane; width: 2; height: 1.1;" 
                  material="shader: chromakey; src: #ar-video; color: #00FF00; transparent: true;"
                  position="0 0 -2" 
                  visible="false">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#ar-video');
      const videoScreen = document.querySelector('#video-screen');

      function adjustAspectRatio() {
        if (video.videoWidth > 0) {
          const ratio = video.videoHeight / video.videoWidth;
          videoScreen.setAttribute('geometry', {
            primitive: 'plane',
            width: 2,
            height: 2 * ratio
          });
        }
      }

      window.addEventListener('touchstart', function () {
        overlay.style.display = 'none';
        
        if (video.readyState >= 1) {
          adjustAspectRatio();
        } else {
          video.addEventListener('loadedmetadata', adjustAspectRatio);
        }

        videoScreen.setAttribute('visible', 'true');
        video.play();
        
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/s/?ie=UTF8&keywords=%E9%98%B2%E7%81%BD+%E5%AE%B6%E5%85%B7+%E3%81%AE+%E5%9B%BA%E5%AE%9A&index=aps&jp-ad-ap=0&tag=jpdeskstandse-22&ref=pd_sl_7ec245ju80_b&adgrpid=1319416604940486&hvadid=82463780725012&hvnetw=o&hvqmt=b&hvbmt=bb&hvdev=c&hvlocint=&hvlocphy=140224&hvtargid=kwd-82464961472559:loc-96&hydadcr=15815_13805625&mcid=3614b63fd30438ab81edec7b1503caad&language=ja_JP&msclkid=4c9bbda83a311f3afd51d788c48c18ed";
        }, 10000);
      }, {once: true});
    </script>
  </body>
</html>
