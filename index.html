<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR Simple</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        
        /* 背面のカメラ映像 */
        #webcam {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* 前面の動画エフェクト */
        #effect-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; /* 比率を維持して画面に収める */
            z-index: 2;
            display: none; /* 最初は隠す */
            /* 黒を透過させ、色をハッキリさせる設定 */
            mix-blend-mode: lighten;
            filter: contrast(1.2) brightness(1.2);
        }

        /* 案内画面 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; justify-content: center; align-items: center;
            font-family: sans-serif; font-size: 20px; z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="overlay">タップして開始</div>
    
    <!-- カメラ映像用のビデオ -->
    <video id="webcam" autoplay playsinline></video>
    
    <!-- エフェクト用のビデオ（黒背景のk.mp4） -->
    <video id="effect-video" src="k.mp4" loop playsinline></video>

    <script>
        const overlay = document.querySelector('#overlay');
        const webcam = document.querySelector('#webcam');
        const effectVideo = document.querySelector('#effect-video');

        // 1. カメラを起動する
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                webcam.srcObject = stream;
            } catch (err) {
                alert("カメラの起動に失敗しました: " + err);
            }
        }

        // 2. タップした時の処理
        window.addEventListener('touchstart', function() {
            if (overlay.style.display === 'none') return;
            
            overlay.style.display = 'none';
            effectVideo.style.display = 'block';
            
            // 動画再生
            effectVideo.play();

            // 10秒後にAmazonへ
            setTimeout(() => {
                window.location.href = "https://www.amazon.co.jp/";
            }, 10000);
        }, {once: true});

        // 最初にカメラだけ起動しておく
        startCamera();
    </script>
</body>
</html>
