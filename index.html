<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Vivid Fix</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.5); color: white; font-family: sans-serif;
        font-size: 20px; z-index: 9999; text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="overlay">画面をタップして開始</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <!-- 
          autoplay, muted を入れることで読み込みをスムーズにします 
          (再生自体はクリック後に行われます)
        -->
        <video id="ar-video" src="k.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-entity camera>
        <!-- 
          material="shader: flat; ..." で色を鮮やかに保ちます。
          transparent: true と、JavaScript側での黒カット処理を組み合わせます。
        -->
        <a-video id="video-screen" 
                 src="#ar-video" 
                 width="2" height="1.1" 
                 position="0 0 -2" 
                 visible="false"
                 material="shader: flat; transparent: true; side: double;">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#ar-video');
      const videoScreen = document.querySelector('#video-screen');

      // 比率を自動調整する関数
      function adjustAspectRatio() {
        if (video.videoWidth > 0) {
          const w = video.videoWidth;
          const h = video.videoHeight;
          const ratio = h / w;
          videoScreen.setAttribute('width', 2);
          videoScreen.setAttribute('height', 2 * ratio);
        }
      }

      window.addEventListener('touchstart', function () {
        overlay.style.display = 'none';
        
        // 比率調整を実行
        if (video.readyState >= 1) {
          adjustAspectRatio();
        } else {
          video.addEventListener('loadedmetadata', adjustAspectRatio);
        }

        // 動画を表示して再生
        videoScreen.setAttribute('visible', 'true');
        
        // iPhone対策：ミュートを解除してから再生
        video.muted = false;
        video.play();

        // 【重要】黒い部分を「透明」として扱うための特殊設定
        // 標準機能を使って、色の明るさが低い部分を描画しないようにします
        const mesh = videoScreen.getObject3D('mesh');
        if (mesh) {
          mesh.material.alphaTest = 0.1; // 0.1以下の明るさをカット
          mesh.material.needsUpdate = true;
        }
        
        // 10秒後に遷移
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/";
        }, 10000);
      }, {once: true});
    </script>
  </body>
</html>
