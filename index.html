<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Vivid Transparent</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // 黒い部分を「切り抜く」ための専用プログラム
      AFRAME.registerShader('transparent-video', {
        schema: { src: {type: 'map'} },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D src;
          void main() {
            vec4 color = texture2D(src, vUv);
            // 色の明るさを計算。真っ黒に近い場合は描画をスキップ（切り抜き）
            float brightness = max(color.r, max(color.g, color.b));
            if (brightness < 0.1) { discard; }
            gl_FragColor = color;
          }
        `
      });
    </script>
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.5); color: white; font-family: sans-serif;
        font-size: 20px; z-index: 9999; text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <div id="overlay">画面をタップして開始</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="ar-video" src="k.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-entity camera>
        <!-- 
          material="shader: transparent-video; ..." で黒を切り抜きます。
          width: 2; に設定（前回のサイズ感）
        -->
        <a-entity id="video-screen" 
                  geometry="primitive: plane; width: 2; height: 2;" 
                  material="shader: transparent-video; src: #ar-video;"
                  position="0 0 -2" 
                  visible="false">
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.querySelector('#overlay');
      const video = document.querySelector('#ar-video');
      const videoScreen = document.querySelector('#video-screen');

      // 比率を自動調整
      function adjustAspectRatio() {
        const w = video.videoWidth;
        const h = video.videoHeight;
        const ratio = h / w;
        videoScreen.setAttribute('geometry', {
          primitive: 'plane',
          width: 2,
          height: 2 * ratio
        });
      }

      window.addEventListener('touchstart', function () {
        overlay.style.display = 'none';
        
        if (video.readyState >= 1) {
          adjustAspectRatio();
        } else {
          video.addEventListener('loadedmetadata', adjustAspectRatio);
        }

        videoScreen.setAttribute('visible', 'true');
        video.play();
        
        setTimeout(function() {
          window.location.href = "https://www.amazon.co.jp/";
        }, 10000);
      }, {once: true});
    </script>
  </body>
</html>
