<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebAR Video Effect</title>
    <!-- A-Frame と AR.js の読み込み -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <!-- 表示したい動画ファイルを指定 (mp4推奨) -->
        <video id="ar-video" src="your-video.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <!-- 
        'hiro' マーカーを使用（AR.js標準のマーカー）
        カメラがこのマーカーを捉えると動画が表示される
      -->
      <a-marker preset="hiro">
        <a-video src="#ar-video" width="1.6" height="0.9" rotation="-90 0 0"></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // 1. 画面をタップしたら動画を再生する（ブラウザの制限対策）
      window.addEventListener('click', function () {
        const video = document.querySelector('#ar-video');
        video.play();
        
        // 2. 10秒後に別サイトへ遷移
        setTimeout(function() {
          window.location.href = "https://example.com"; // 移行先のURL
        }, 10000); // 10000ミリ秒 = 10秒
      });
    </script>
  </body>
</html>
